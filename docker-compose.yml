# ============================================
# 数智游民创新工场官网 · Docker 一键编排
# 启动：docker compose up -d --build（或直接运行一键脚本 scripts/start-all）
# 访问：http://localhost/（后台 /index，前台 /home.html；后端 8080 不对外映射）
# 首次启动自动初始化数据库（sql/ 按依赖顺序导入）
# 配置：复制 .env.example 为 .env 并按需修改（口令/邮箱/密钥等均环境变量注入）
# 注意：容器名 2026-08-24 起由 wanshiwu-* 改为 opc-*；升级旧部署时先
#       docker compose down 释放旧容器名，再 docker compose up -d
# ============================================
services:
  # ---------- MySQL 8 ----------
  mysql:
    image: mysql:8.0
    container_name: opc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ry-vue
      # 健康检查与 mysql-init.sh 均使用 $MYSQL_ROOT_PASSWORD（容器内），与宿主 .env 一致
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # SQL 脚本目录（mysql-init.sh 按依赖顺序导入）
      - ./sql:/docker-entrypoint-initdb.d/sql:ro
      - ./docker/mysql-init.sh:/docker-entrypoint-initdb.d/mysql-init.sh:ro
    # 仅容器内网可达（后端经 DB_HOST=mysql 连接）；如本机调试需直连 mysql，
    # 再临时加回 ports 映射（公网服务器务必保持不映射）
    expose:
      - "3306"
    healthcheck:
      # $$ 转义为容器内环境变量 MYSQL_ROOT_PASSWORD（与口令环境变量化联动）
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: opc-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    # 仅容器内网可达（后端经 REDIS_HOST=redis 连接）；如本机调试需直连 redis-cli，
    # 再临时加回 ports 映射（公网服务器务必保持不映射）
    expose:
      - "6379"
    healthcheck:
      # 有密码带 -a 验证，无密码直连（两种形态都覆盖）
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------- 后端 ----------
  backend:
    # 线上镜像（Docker Hub）：部署方无需源码直接拉取；build 保留供本地重新构建
    image: jerryvon/opc-backend:v2.3
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opc-backend
    environment:
      # 覆盖 application-druid.yml / application.yml 的默认 localhost
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USERNAME: root
      # R11 fix: DB_PASSWORD 默认跟随 MYSQL_ROOT_PASSWORD（只改一个也能生效）
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:-password}}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # JWT 签名密钥：必填（:? 缺失即报错）——后端拒绝用仓库默认密钥启动
      # （TokenService.checkSecretNotDefault，B1）；start-all 脚本会自动生成写入 .env
      TOKEN_SECRET: ${TOKEN_SECRET:?未设置 TOKEN_SECRET——请运行 scripts\start-all 自动生成，或在 .env 设置强随机值}
      # 邮件通知：docker compose 自动读取本目录 .env 文件（MAIL_USERNAME=发件邮箱、MAIL_AUTH_CODE=授权码；MAIL_ENABLED=false 可关）
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_AUTH_CODE: ${MAIL_AUTH_CODE:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      # 授权码 AES 加密密钥（R5 fix: 补注入；未设置时后台保存授权码会被拒绝）
      MAIL_SECRET_KEY: ${MAIL_SECRET_KEY:-}
      # 上传文件目录（容器内，持久化到 upload 卷）
      RUOYI_PROFILE: /home/ruoyi/uploadPath
      TZ: Asia/Shanghai
    volumes:
      - upload:/home/ruoyi/uploadPath
    # 仅容器内网可达（nginx 反代经 backend:8080 访问）；公网入口统一走前端 80，后端不直接暴露防接口泄露
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------- 前端（Nginx 托管 + 代理 /prod-api 与 /profile） ----------
  frontend:
    # 线上镜像（Docker Hub）：部署方无需源码直接拉取；build 保留供本地重新构建
    image: jerryvon/opc-frontend:v2.3
    build:
      context: .
      dockerfile: ruoyi-ui/Dockerfile
    container_name: opc-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  upload:

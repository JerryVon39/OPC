<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模板样式预览 · 区块管理</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/site.css">
<style>
  body { margin: 0; background: #f2f3f5; }
  /* 预览页容器：栏目页区块用 .pblock 文档流样式；首页模板同样用白卡包裹 */
  .pv-stage { max-width: 1140px; margin: 0 auto; padding: 24px 16px; }
  .pv-tip { text-align: center; color: #909399; font-size: 12px; padding: 10px 0 4px; }
</style>
</head>
<body>
<div class="pv-stage" id="pvStage"></div>
<script src="js/site.js"></script>
<script>
  // 模板样式预览：由后台「区块管理 → 新增 → 预览样式」打开。
  // 复用前台真实渲染器（site.js）：scene=home 走 renderSection（首页模块），其余走 renderPageBlock（栏目页区块），
  // 与前台渲染完全一致，不会出现"后台看起来好、前台走样"的分叉。
  (function () {
    const qs = new URLSearchParams(location.search);
    const template = qs.get('template') || 'text';
    const scene = qs.get('scene') || 'page';
    let cfg = {};
    try { cfg = JSON.parse(qs.get('cfg') || '{}'); } catch (e) { cfg = {}; }
    const block = { template: template, title: '示例区块标题', blockKey: 'tpl-preview', configJson: JSON.stringify(cfg) };
    const stage = document.getElementById('pvStage');
    let html = '';
    try {
      if (scene === 'home' && typeof renderSection === 'function') {
        html = renderSection(block, 1);
      } else if (typeof renderPageBlock === 'function') {
        html = renderPageBlock(block, 1);
      } else {
        html = '<p style="text-align:center;color:#909399">渲染器未加载（site.js 加载失败）</p>';
      }
    } catch (e) {
      html = '<p style="text-align:center;color:#c45656">渲染出错：' + String(e && e.message || e) + '</p>';
    }
    stage.innerHTML = html;
    // 预览说明条
    const tip = document.createElement('div');
    tip.className = 'pv-tip';
    tip.textContent = '↑ 上图为「' + template + '」模板使用示例数据的渲染效果，保存后前台按你的实际内容渲染';
    stage.appendChild(tip);
  })();
</script>
</body>
</html>

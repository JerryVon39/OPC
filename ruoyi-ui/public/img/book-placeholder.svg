<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
  <rect width="200" height="280" fill="#f0f2f5"/>
  <g transform="translate(100,120)">
    <!-- 书本 -->
    <rect x="-60" y="-80" width="120" height="170" rx="8" fill="#ffffff" stroke="#d5dde8" stroke-width="2"/>
    <rect x="-52" y="-68" width="104" height="146" rx="4" fill="none" stroke="#eef1f6" stroke-width="1.5"/>
    <!-- 书脊线 -->

# ============================================
# 数智游民创新工场 · 前端 Nginx 配置
# 前端静态页面 + /prod-api 反向代理到后端 + /profile 封面图片
# 2026-08-24 更新：server_tokens 关闭、基础安全响应头、登录接口 IP 限流
# 说明：前台为多页静态站且依赖大量内联脚本/样式，未加严格 CSP（会破坏页面渲染）
# ============================================

# 登录接口限流（防暴力破解）：60 次/分钟/IP，突发放宽 20 次
# 覆盖后台 /login 与前台成员 /system/reader/login。
# 注意：不能设太紧（曾用 10r/m burst 5，正常登录失败几次+刷新即 503 误伤，
# 表现为"无法进入后台"）；后端已有账户锁（5 次/10 分钟）+ IP 频控兜底
limit_req_zone $binary_remote_addr zone=opc_login:10m rate=60r/m;

server {
    listen       80;
    server_name  localhost;
    # 隐藏 nginx 版本号（防版本指纹扫描）
    server_tokens off;

    # 基础安全响应头
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 静态资源不缓存（ETag 条件请求，更新后立即生效；本站资源小，性能影响可忽略）
    add_header Cache-Control "no-cache" always;

    # 根路径直达官网首页（后台管理走 /index 路由）
    location = / {
        return 301 /home.html;
    }

    # 前端页面（vue 构建产物）
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后台登录接口：IP 限流（防爆破）
    location = /prod-api/login {
        limit_req zone=opc_login burst=20 nodelay;
        proxy_pass http://backend:8080/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 前台成员登录接口：IP 限流（防爆破）
    location = /prod-api/system/reader/login {
        limit_req zone=opc_login burst=20 nodelay;
        proxy_pass http://backend:8080/system/reader/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 后端接口代理（前端请求带 /prod-api 前缀，去掉后转发给后端）
    location /prod-api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传的封面图片（后端本地存储 /profile/ 目录）
    location /profile/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1k;
}

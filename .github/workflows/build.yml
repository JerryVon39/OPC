name: Build

# 推送/PR 到 master 时自动执行 Maven 打包
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run unit tests
        run: mvn -B test -pl ruoyi-system -am

      - name: Build with Maven
        run: mvn -B package -DskipTests -pl ruoyi-admin -am

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruoyi-admin
          path: ruoyi-admin/target/ruoyi-admin.jar

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: ruoyi-system/target/surefire-reports

      # ============ Docker 镜像构建验证（Dockerfile 可用性） ============
      - name: Build backend docker image
        run: docker build -t wanshiwu-backend:ci .

      - name: Build frontend docker image
        run: docker build -t wanshiwu-frontend:ci -f ruoyi-ui/Dockerfile .
